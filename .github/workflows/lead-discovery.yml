name: Lead Discovery

on:
  schedule:
    # Tiap 30 menit, sama kayak outreach - per user request "terus menerus cari tanpa henti".
    # Cuma bisa jalan senyaman ini karena repo udah public (Actions minutes unlimited gratis) -
    # dulu 1x/hari doang waktu masih private (budget 2000 menit/bulan gampang abis kalau sesering
    # ini, apalagi digabung sama outreach bot yang juga tiap 30 menit).
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = preview lead yang ketemu doang (gak nulis ke sheet), false = beneran nambah ke sheet"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run lead discovery
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Kosong = skip Google Maps scraping, cuma jalanin web scraper (yang saat ini
          # keblokir bot-detection di semua sumbernya - lihat discovery/web_scraper.py).
          GMAPS_LIST_URLS: ${{ secrets.GMAPS_LIST_URLS }}
          DISCOVERY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || secrets.DISCOVERY_DRY_RUN }}
        run: python discovery_main.py
