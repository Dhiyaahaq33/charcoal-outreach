name: Check Fonnte Status (read-only)

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Fonnte device status
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/check_fonnte_status.py
