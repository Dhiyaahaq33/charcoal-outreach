name: Enrich Maps Links (Contact Person)

on:
  schedule:
    # Offset 15 menit dari outreach.yml/lead-discovery.yml (yang jalan di :00/:30) biar gak
    # numpuk runner bareng - re-scrape Maps satu-per-satu ini jalan bertahap, gak perlu instan.
    - cron: "15,45 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Jalur cadangan KETIGA buat command Telegram - jadwal ini beda offset (:15/:45) dari
      # outreach.yml/lead-discovery.yml (:00/:30), jadi nambah titik cek independen lagi biar
      # command "kirim wa ke N klien" dkk kepancing lebih cepat kalau jadwal lain lagi lambat.
      - name: Poll Telegram commands
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u telegram_bot.py
        continue-on-error: true

      - name: Enrich Contact Person with Maps links
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/enrich_maps_links.py
