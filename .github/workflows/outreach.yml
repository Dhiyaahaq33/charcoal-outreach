name: Charcoal Outreach Bot

on:
  schedule:
    # Tiap 30 menit, sepanjang hari - jam kerja tiap negara dihitung sendiri di timezone_rules.py,
    # jadi cron-nya sengaja jalan terus-terusan (bukan cuma jam kerja WIB) biar nyamber semua zona.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = simulasi doang (gak kirim & gak update sheet), false = kirim beneran"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run outreach bot
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Manual run (workflow_dispatch) pakai input dry_run. Cron terjadwal SELALU pakai secret
          # DRY_RUN kamu di GitHub Secrets - set ke "false" di sana kalau udah siap live.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || secrets.DRY_RUN }}
        run: python main.py
